<p class="text-2xl text-center text-gray-500 mt-5 mb-3 font-semibold">Catalogue de jus</p>
    <div class="flex flex-wrap p-3 justify-center">
          <div *ngFor="let article of articles" class="max-w-sm p-2 mr-3 mt-2 mb-2 bg-white border border-gray-200 rounded-lg shadow dark:bg-gray-800 dark:border-gray-700">
            <a href="#">
                <img class="rounded-t-lg" src='{{ "assets/images/" + article.image + ".png" }}' alt="" />
            </a>
            <div class="p-5">
                <a href="#">
                    <h5 class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white">{{ article.label }}</h5>
                </a>
                <p class="mb-3 font-normal text-gray-700 dark:text-gray-400">Capacité : {{ article.description }}</p>
                <p class="font-bold">{{ article.prix }} €</p>
                <a href="#" class="inline-flex items-center mt-2 px-3 py-2 text-sm font-medium text-center text-white bg-blue-700 rounded-lg hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 dark:bg-blue-600 dark:hover:bg-blue-700 dark:focus:ring-blue-800">
                    Ajouter au panier 
                    <svg class="w-6 h-6 ml-2 text-white dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                      <path fill-rule="evenodd" d="M4 4a1 1 0 0 1 1-1h1.5a1 1 0 0 1 .979.796L7.939 6H19a1 1 0 0 1 .979 1.204l-1.25 6a1 1 0 0 1-.979.796H9.605l.208 1H17a3 3 0 1 1-2.83 2h-2.34a3 3 0 1 1-4.009-1.76L5.686 5H5a1 1 0 0 1-1-1Z" clip-rule="evenodd"/>
                    </svg>                    
                </a>
            </div>
          </div>
    </div>
